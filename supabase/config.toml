# Supabase CLI project configuration (local development and `supabase functions deploy`).
# Hosted-project auth settings must also be set in the dashboard; see docs/setup.md.
project_id = "staff-safe-commute"

[api]
enabled = true
schemas = ["public"]
max_rows = 200

[db]
major_version = 15

[realtime]
enabled = true

[auth]
enabled = true
site_url = "staffsafecommute://"
additional_redirect_urls = ["staffsafecommute://reset-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Invitation-only onboarding: no public self-registration.
enable_signup = false
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.rate_limit]
email_sent = 10
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30

[functions.invite-user]
verify_jwt = true

[functions.dispatch-notifications]
# Called by pg_cron with x-cron-secret; the function verifies either that secret or a user JWT itself.
verify_jwt = false
